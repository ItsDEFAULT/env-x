name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # Let every OS finish, so one run shows all platform-specific failures.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
